{% load image_tags %}
{% for content_block in content_blocks %}
	<!-- {{ content_block.name|upper }} -->
	<section class="section section--{{ content_block.slug }}" id="{{ content_block.slug }}">
		<h2 class="section__header">{{ content_block.name|upper }}  <a href="#{{ content_block.slug }}"><i class="fa fa-chain fa-chain-big"></i></a></h2>
		<div class="section__content">
			{% if content_block.image %}
			<img
				class="content-block__image"
				src="{{ content_block.image|capped_src }}"
				srcset="{{ content_block.image|srcset_capped }}"
				sizes="(min-width: 960px) 720px, (min-width: 768px) calc(100vw - 80px), calc(100vw - 40px)"
				alt="{{ content_block.image_alt }}"
				loading="lazy"
			>
			{% endif %}
			{{ content_block.content|safe }}
		</div>
	</section>
{% endfor %}
